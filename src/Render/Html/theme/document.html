<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{pageTitle}}</title>{{baseHref}}{{headExtra}}
    <link rel="stylesheet" href="assets/site.css">
    <script src="assets/site.js"></script>
</head>
<body>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="Chapters">
        <div class="sidebar-header">
            <a class="sidebar-brand" href="index.html">{{bookTitle}}</a>
            <p class="sidebar-subtitle">{{bookSubtitle}}</p>
        </div>
        {{sidebar}}
    </aside>
    <div class="layout">
        <header class="topbar">
            <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Open chapter list" title="Chapters">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
            <p class="topbar-title">{{topbarTitle}}</p>
            <div class="topbar-actions">
                <button type="button" class="search-open" id="search-open" aria-label="Search" title="Search (/)">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                </button>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                </button>
            </div>
        </header>
        <main class="content">
            {{body}}
        </main>
    </div>
    <div class="search-modal" id="search-modal" hidden role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
        <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
        <div class="search-modal-panel" id="search-modal-panel">
            <h2 id="search-modal-title" class="visually-hidden">Search</h2>
            <div class="search-modal-header">
                <div class="search-modal-input-wrap">
                    <svg class="search-modal-input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                    <label class="visually-hidden" for="search-modal-input">Search chapters</label>
                    <input id="search-modal-input" type="search" role="searchbox" placeholder="Search chapters…" autocomplete="off">
                </div>
                <button type="button" class="search-modal-close" id="search-modal-close" aria-label="Close search">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
            </div>
            <div class="search-modal-body">
                <p class="search-modal-hint" id="search-modal-hint"><kbd>/</kbd> to search from any page</p>
                <div class="search-results" id="search-results" hidden></div>
            </div>
        </div>
    </div>
</body>
</html>
