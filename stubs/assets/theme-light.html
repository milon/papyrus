<header>
  <style>
    body {
      font-family: librelibertine;
      font-size: 16px;
      line-height: 1.4;
      color: #252525;
    }

    h1 {
      font-size: 35px;
      font-family: times;
      padding-top: 0;
      padding-bottom: 70px;
    }

    h2 {
      text-align: left;
      font-family: times;
      font-size: 24px;
      padding-top: 0;
      padding-bottom: 30px;
    }

    h3 {
      text-align: left;
      font-family: times;
      font-size: 19px;
      padding-top: 20px;
      padding-bottom: 0;
    }

    p, ul, ol {
      margin-bottom: 20px;
    }

    pre {
      line-height: 20px;
      page-break-inside: avoid;
      border-left: solid 4px #dd7878;
      background-color: #eff1f5;
      padding-top: 15px;
      padding-bottom: 15px;
      padding-left: 20px;
      margin-bottom: 30px;
    }

    .mermaid-diagram {
      page-break-inside: avoid;
      margin: 0 0 30px 0;
      text-align: center;
    }

    .mermaid-diagram img {
      max-width: 100%;
      height: auto;
    }

    a {
      color: #1a1c3e;
    }

    pre code {
      background: none;
      font-family: oxproto;
      /*
       * Sized to the Crown Quarto trim in papyrus.php: at 27mm margins this
       * fits 66 monospace characters, which is the hard limit code
       * listings are written to. Raising it re-introduces wrapped,
       * unindented code.
       */
      font-size: 12px;
      color: #2d2d2d;
    }

    code {
      font-family: oxproto;
      font-size: 14px;
      color: #e64553;
    }

    /*
     * highlight.js "github-gist" theme, inlined verbatim.
     * Code is highlighted at build time into `hljs-*` spans. mPDF does not
     * fetch remote <link> stylesheets during the PDF build, so the CDN link
     * this replaces produced un-colored code blocks. The upstream theme's
     * `.hljs { background: white }` rule is intentionally omitted so the
     * theme's own `pre` background is preserved.
     */
    .hljs-comment, .hljs-meta { color: #969896; }
    .hljs-variable, .hljs-template-variable, .hljs-strong, .hljs-emphasis, .hljs-quote { color: #df5000; }
    .hljs-keyword, .hljs-selector-tag, .hljs-type { color: #d73a49; }
    .hljs-literal, .hljs-symbol, .hljs-bullet, .hljs-attribute { color: #0086b3; }
    .hljs-section, .hljs-name { color: #63a35c; }
    .hljs-tag { color: #333333; }
    .hljs-title, .hljs-attr, .hljs-selector-id, .hljs-selector-class, .hljs-selector-attr, .hljs-selector-pseudo { color: #6f42c1; }
    .hljs-addition { color: #55a532; background-color: #eaffea; }
    .hljs-deletion { color: #bd2c00; background-color: #ffecec; }
    .hljs-link { text-decoration: underline; }
    .hljs-number { color: #005cc5; }
    .hljs-string { color: #032f62; }

    .mpdf_toc {
      font-family: librelibertine;
      color: #252525;
    }

    div.mpdf_toc_level_0 {
      padding-top: 30px;
      line-height: 30px;
    }

    div.mpdf_toc_level_1 {
      line-height: 30px;
    }

    div.mpdf_toc_level_2 {
      line-height: 30px;
    }

    span.mpdf_toc_t_level_0, span.mpdf_toc_p_level_0 {
      color: #252525;
      font-family: librelibertine;
      font-weight: bold;
      font-style: normal;
    }

    span.mpdf_toc_t_level_1, span.mpdf_toc_p_level_1 {
      color: #252525;
      font-family: librelibertine;
      font-weight: normal;
      font-style: normal;
    }

    span.mpdf_toc_t_level_2, span.mpdf_toc_p_level_2 {
      color: #252525;
      font-family: librelibertine;
      font-weight: normal;
      font-style: normal;
    }

    #toc-title {
      font-weight: bold;
      font-size: 45px;
      padding-top: 0;
      padding-bottom: 10px;
      text-align: center;
    }

    blockquote {
      margin-top: 0;
      margin-right: 0;
      margin-bottom: 30px;
      margin-left: 0;
      page-break-inside: avoid;
    }

    blockquote p {
      margin-top: 0;
      margin-bottom: 0;
    }

    blockquote.quote {
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
      font-style: italic;
    }

    blockquote.notice {
      background-color: #f0f5ff;
      border-left: solid 4px #5b87dd;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    blockquote.notice strong {
      color: #255ac0;
    }

    blockquote.warning {
      background-color: #ffeced;
      border-left: solid 4px #dd787d;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    blockquote.warning strong {
      color: #c0262b;
    }
    blockquote.notice {
      background-color: #f0f5ff;
      border-left: solid 4px #5b87dd;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    blockquote.note strong {
      color: #255ac0;
    }

    blockquote.note {
      background-color: #f0f5ff;
      border-left: solid 4px #5b87dd;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    blockquote.note div.title {
      color: #255ac0;
      font-weight: bold;
    }

    blockquote.notice strong {
      color: #255ac0;
    }

    blockquote.tip {
      background-color: #e7c4f8;
      border-left: solid 4px #ab11f1;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    blockquote.tip div.title {
      color: #52007f;
      font-weight: bold;
    }
    blockquote.tip strong {
      color: #52007f;
      font-weight: bold;
    }

    blockquote.caution {
      background-color: #fbe6b9;
      border-left: solid 4px #f1ae2f;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    blockquote.caution div.title {
      color: #5f420d;
      font-weight: bold;
    }

    blockquote.caution strong {
      color: #5f420d;
    }

    blockquote.danger {
      background-color: #ffeced;
      border-left: solid 4px #dd787d;
      padding-top: 20px;
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }
    blockquote.danger div.title {
      color: #c0262b;
      font-weight: bold;
    }

    blockquote.danger strong {
      color: #c0262b;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 25px;
    }

    td, th {
      border: none;
      border-bottom: 1px solid #9ca0b0;
      padding: 12px 15px;
      text-align: left;
    }

    td:first-child, th:first-child {
      padding-left: 0;
    }

    td:last-child, th:last-child {
      padding-right: 0;
    }

    th {
      font-weight: bold;
    }

    /*
     * The copyright and dedication pages themselves live in
     * content/00-front-matter/ as plain Markdown (so EPUB/HTML builds pick
     * them up too) and are injected before this tocpagebreak by Papyrus
     * pretoc handling. Only their theme-specific colors live
     * here. The colophon reuses .colophon-table from the back matter
     * (content/09-appendix/).
     */
    .frontmatter-page {
      page-break-after: always;
      text-align: left;
      padding-top: 300px;
      font-family: librelibertine;
      font-size: 12px;
      line-height: 1.6;
      color: #606c76;
    }

    .frontmatter-page .frontmatter-heading {
      font-family: librelibertine;
      font-weight: bold;
      font-size: 15px;
      color: #252525;
      padding-bottom: 20px;
    }

    .colophon-table {
      width: 100%;
      border-collapse: collapse;
      font-family: librelibertine;
      font-size: 12px;
      line-height: 1.6;
      color: #606c76;
    }

    .colophon-table td {
      border: none;
      padding: 0 0 20px 0;
      vertical-align: top;
      font-family: librelibertine;
      font-size: 12px;
      color: #606c76;
    }

    .colophon-table td.colophon-label {
      font-weight: bold;
      width: 130px;
      padding-right: 20px;
      white-space: nowrap;
    }

    /*
     * No page-break-after here, unlike the EPUB and HTML stylesheets: the
     * dedication is the last pretoc chapter, and the blank verso markup
     * below ends its page instead. Breaking here would open the blank page
     * before the folio is suppressed, so it would print a page number.
     */
    .dedication-page {
      text-align: left;
      padding-top: 400px;
    }

    .dedication-page .dedication-text {
      font-family: librelibertine;
      font-style: italic;
      font-size: 20px;
      color: #252525;
    }
  </style>

</header>

<div style="page-break-after: always; text-align: center; padding-top: 320px;">
  <div style="font-family: times; font-size: 40px; font-weight: bold;">{{$title}}</div>
  <div style="font-family: times; font-size: 17px; padding-top: 25px; padding-bottom: 90px; color: #606c76;">{{$subtitle}}</div>
  <div style="font-family: times; font-size: 22px;">{{$author}}</div>
</div>

<!-- PAPYRUS:TOC -->
<!--
  The dedication is a recto, so the front matter closes on a blank verso
  before the contents. The &nbsp; is what makes mPDF emit that page at all.
  Page numbering, suppressed since the title page by Papyrus
  front-matter handling, resumes here at the contents.
-->
<pagebreak />
&nbsp;
<pagebreak suppress="off" />
<tocpagebreak links="on"
              toc-suppress="on"
              toc-preHTML="&lt;h1 id=&quot;toc-title&quot;&gt;Table of Contents&lt;/h1&gt;"
              toc-bookmarkText="Contents">
