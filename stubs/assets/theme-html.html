<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{$title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@9.18.1/build/styles/github-gist.min.css">
    <style>
        main.container {
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
            padding: 2.5rem clamp(1.5rem, 5vw, 3.5rem) 4rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="row">
            <div class="column"><h1>{{$title}}</h1></div>
        </div>
        <div class="row">
            <div class="column"><p>{{$subtitle}}</p></div>
        </div>
        <div class="row">
            <div class="column"><h2>{{$author}}</h2></div>
        </div>
        {{$body}}
    </main>
</body>
</html>
