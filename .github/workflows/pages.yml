name: pages

# Deploys to https://milon.github.io/papyrus/
# Public URL: https://oss.milon.im/papyrus/ (Cloudflare Worker in milon/oss)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, gd, mbstring, zip, zlib
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Chromium for Mermaid
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build handbook site
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          if [[ -z "${PUPPETEER_EXECUTABLE_PATH}" ]]; then
            for candidate in google-chrome chrome chromium chromium-browser; do
              if command -v "$candidate" >/dev/null 2>&1; then
                export PUPPETEER_EXECUTABLE_PATH="$(command -v "$candidate")"
                break
              fi
            done
          fi
          echo "Using Chrome at: ${PUPPETEER_EXECUTABLE_PATH:-not set}"
          ./bin/papyrus build:site -d examples/the-papyrus-handbook -e docs
          test -f docs/the-papyrus-handbook-site/index.html
          test -f docs/the-papyrus-handbook-site/404.html
          grep -q 'base href="/papyrus/"' docs/the-papyrus-handbook-site/index.html
          # cname in papyrus.php is for absolute sitemap URLs only; do not claim the domain.
          rm -f docs/the-papyrus-handbook-site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/the-papyrus-handbook-site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
