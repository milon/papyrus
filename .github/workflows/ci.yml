name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring, zip, zlib
          coverage: none
          tools: composer:v2

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: Build mini-book fixture
        run: |
          ./bin/papyrus build --dir=tests/fixtures/mini-book
          test -f tests/fixtures/mini-book/export/mini-book-light.pdf
          test -f tests/fixtures/mini-book/export/mini-book-dark.pdf
          test -f tests/fixtures/mini-book/export/mini-book.epub
          test -f tests/fixtures/mini-book/export/mini-book.html
