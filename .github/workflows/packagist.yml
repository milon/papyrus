# Keep Packagist in sync when GitHub changes.
# Add repository secrets (https://packagist.org/profile/ → API Token):
#   PACKAGIST_USERNAME
#   PACKAGIST_TOKEN
name: packagist

on:
  push:
    branches: [main, master]
    tags: ["*"]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::Set PACKAGIST_USERNAME and PACKAGIST_TOKEN repository secrets (from https://packagist.org/profile/)."
            exit 1
          fi

          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/milon/papyrus"}}'

          echo "Packagist update requested for milon/papyrus."
